name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-${{ github.sha }}
          path: app/build/reports/tests/

      # "better" = optimized build with applicationId org.moedog.ehviewer.better.
      # It installs next to the original EhViewer instead of replacing it.
      - name: Gradle Build
        run: ./gradlew assembleBetter

      - name: Upload Universal
        uses: actions/upload-artifact@v7
        with:
          name: better-universal-${{ github.sha }}
          path: app/build/outputs/apk/better/app-universal-better.apk

      - name: Upload ARM64
        uses: actions/upload-artifact@v7
        with:
          name: better-arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/better/app-arm64-v8a-better.apk

      - name: Upload ARM32
        uses: actions/upload-artifact@v7
        with:
          name: better-armeabi-v7a-${{ github.sha }}
          path: app/build/outputs/apk/better/app-armeabi-v7a-better.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          name: better-x86_64-${{ github.sha }}
          path: app/build/outputs/apk/better/app-x86_64-better.apk

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: better-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/better/mapping.txt
