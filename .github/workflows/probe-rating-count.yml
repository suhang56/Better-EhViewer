name: Probe rating count sources

# Temporary diagnostic: where can the number of ratings of a gallery be read cheaply?
on:
  push:
    branches:
      - ccr-6d78e0b9-orokj0
    paths:
      - .github/workflows/probe-rating-count.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch list pages in every display mode and a detail page
        run: |
          set -u
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          J=cookies.txt
          echo -e "e-hentai.org\tFALSE\t/\tFALSE\t0\tnw\t1" > $J
          for m in m p l e t; do
            curl -sL -w "HTTP %{http_code} after %{num_redirects} redirect(s)\n" -A "$UA" -b $J -c $J "https://e-hentai.org/?f_search=artist%3Ashindol%24&inline_set=dm_$m" -o list_$m.html
            echo "===== display mode $m: $(wc -c < list_$m.html) bytes"
            # Everything around the first rating element
            python3 - "$m" <<'PY'
          import re, sys
          m = sys.argv[1]
          s = open(f"list_{m}.html", encoding="utf-8", errors="replace").read()
          i = s.find('class="ir')
          print("first .ir context:", re.sub(r'https?://\S+', '<url>', s[max(0, i-300):i+500]) if i >= 0 else "NO .ir")
          for pat in [r'rating', r'Rating', r'rated', r'votes?', r'title="[^"]*\d+[^"]*"']:
              hits = re.findall(r'.{0,80}' + pat + r'.{0,80}', s)
              print(f"pattern {pat!r}: {len(hits)} hits")
              for h in hits[:4]:
                  print("   ", re.sub(r'https?://\S+', '<url>', h))
          PY
          done
          # A detail page, for comparison
          GL=$(grep -o 'https://e-hentai.org/g/[0-9]*/[0-9a-f]*/' list_m.html | head -1)
          echo "===== detail page $GL"
          curl -sL -A "$UA" -b $J "$GL" -o detail.html
          echo "detail bytes: $(wc -c < detail.html)"
          grep -o '.\{0,200\}rating_count.\{0,200\}' detail.html | head -3
          grep -o '.\{0,120\}rating_label.\{0,120\}' detail.html | head -3
          # Detail page variants that might be lighter
          for q in "?hc=0" "?p=99999" "?inline_set=ts_m"; do
            curl -sL -A "$UA" -b $J "$GL$q" -o d.html
            echo "variant $q: $(wc -c < d.html) bytes, rating_count present: $(grep -c rating_count d.html)"
          done
          # gdata: every key it returns
          GID=$(echo "$GL" | cut -d/ -f5); TOK=$(echo "$GL" | cut -d/ -f6)
          curl -s -A "$UA" -H 'Content-Type: application/json' -d "{\"method\":\"gdata\",\"gidlist\":[[$GID,\"$TOK\"]],\"namespace\":1}" https://api.e-hentai.org/api.php | python3 -c 'import json,sys; d=json.load(sys.stdin)["gmetadata"][0]; print("gdata keys:", sorted(d)); print({k:d[k] for k in d if k not in ("tags","torrents","title","title_jpn","thumb")})'
