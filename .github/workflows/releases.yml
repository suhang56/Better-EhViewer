name: Releases

on:
  push:
    tags:
      - "*"

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Better-EhViewer publishes only the "better" build (applicationId org.moedog.ehviewer.better),
      # so a release of this fork never installs over the original EhViewer.
      - name: Gradle Build
        run: ./gradlew assembleBetter

      - name: Rename Apks
        run: |
          mv app/build/outputs/apk/better/app-universal-better.apk EhViewer-Better-${{ github.ref_name }}-universal.apk
          mv app/build/outputs/apk/better/app-arm64-v8a-better.apk EhViewer-Better-${{ github.ref_name }}-arm64-v8a.apk
          mv app/build/outputs/apk/better/app-armeabi-v7a-better.apk EhViewer-Better-${{ github.ref_name }}-armeabi-v7a.apk
          mv app/build/outputs/apk/better/app-x86_64-better.apk EhViewer-Better-${{ github.ref_name }}-x86_64.apk
          mv app/build/outputs/mapping/better/mapping.txt EhViewer-Better-${{ github.ref_name }}-mapping.txt
          mv app/build/outputs/native-debug-symbols/better/native-debug-symbols.zip EhViewer-Better-${{ github.ref_name }}-native-debug-symbols.zip

      - name: Releases
        uses: softprops/action-gh-release@v3
        with:
          body: Bump Version
          files: |
            EhViewer-Better-${{ github.ref_name }}-universal.apk
            EhViewer-Better-${{ github.ref_name }}-arm64-v8a.apk
            EhViewer-Better-${{ github.ref_name }}-armeabi-v7a.apk
            EhViewer-Better-${{ github.ref_name }}-x86_64.apk
            EhViewer-Better-${{ github.ref_name }}-mapping.txt
            EhViewer-Better-${{ github.ref_name }}-native-debug-symbols.zip
